name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG 与 manifest.json 的 $VERSION 不一致"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
